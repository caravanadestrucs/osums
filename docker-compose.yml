
services:

  app:
    build:
      context: .
      dockerfile_inline: |
        FROM php:8.1-apache

        ENV DEBIAN_FRONTEND=noninteractive

        RUN apt-get update && apt-get install -y \
            git \
            unzip \
            curl \
            libzip-dev \
            libpng-dev \
            libjpeg62-turbo-dev \
            libfreetype6-dev \
            libonig-dev \
            libxml2-dev \
            libicu-dev \
            && rm -rf /var/lib/apt/lists/*

        RUN docker-php-ext-configure gd \
            --with-freetype \
            --with-jpeg

        RUN docker-php-ext-install \
            pdo_mysql \
            mbstring \
            exif \
            pcntl \
            bcmath \
            gd \
            zip

        RUN curl -fsSL https://getcomposer.org/installer \
            | php -- \
            --install-dir=/usr/local/bin \
            --filename=composer

        RUN a2enmod rewrite

        ENV APACHE_DOCUMENT_ROOT=/var/www/html/public

        RUN sed -ri \
            -e 's!/var/www/html!${APACHE_DOCUMENT_ROOT}!g' \
            /etc/apache2/sites-available/*.conf \
            /etc/apache2/apache2.conf

        WORKDIR /var/www/html

    container_name: osums-app
    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html
      - osums_vendor:/var/www/html/vendor
      - osums_storage:/var/www/html/storage

    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: osums
      DB_USERNAME: osums
      DB_PASSWORD: osums_password

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8080:80"

    command:
      - /bin/bash
      - -c
      - |
        set -e

        echo "======================================"
        echo " OSUMS - iniciando"
        echo "======================================"

        cd /var/www/html

        echo "PHP:"
        php -v

        echo "Composer:"
        composer --version

        echo "======================================"
        echo " Instalando dependencias"
        echo "======================================"

        if [ -f composer.json ]; then
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader
        else
          echo "ERROR: No existe composer.json"
          exit 1
        fi

        echo "======================================"
        echo " Configurando Laravel"
        echo "======================================"

        if [ -f .env.example ] && [ ! -f .env ]; then
          cp .env.example .env
        fi

        if [ -f artisan ]; then
          php artisan key:generate --force || true
          php artisan storage:link || true
        fi

        mkdir -p storage bootstrap/cache

        chown -R www-data:www-data \
          storage \
          bootstrap/cache

        echo "======================================"
        echo " Ejecutando migraciones"
        echo "======================================"

        if [ -f artisan ]; then
          php artisan migrate --force || true
        fi

        echo "======================================"
        echo " OSUMS listo"
        echo "======================================"

        apache2-foreground


  db:
    image: mariadb:10.6
    container_name: osums-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: osums
      MYSQL_USER: osums
      MYSQL_PASSWORD: osums_password
      MYSQL_ROOT_PASSWORD: cambia_root_password

    volumes:
      - osums_db:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 10


volumes:
  osums_db:
  osums_vendor:
  osums_storage:

