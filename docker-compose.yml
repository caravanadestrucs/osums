

services:

  app:
    image: php:8.1-apache
    container_name: osums-app
    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html
      - osums_vendor:/var/www/html/vendor
      - osums_storage:/var/www/html/storage

    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: osums
      DB_USERNAME: osums
      DB_PASSWORD: osums_password

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8080:80"

    command: >
      bash -c "
        set -e;

        echo '======================================';
        echo ' Instalando dependencias del sistema ';
        echo '======================================';

        apt-get update;

        apt-get install -y
          git
          unzip
          curl
          libzip-dev
          libpng-dev
          libjpeg-dev
          libfreetype6-dev
          libonig-dev
          libxml2-dev;

        echo '======================================';
        echo ' Instalando extensiones PHP ';
        echo '======================================';

        docker-php-ext-configure gd
          --with-freetype
          --with-jpeg;

        docker-php-ext-install
          pdo_mysql
          mbstring
          exif
          pcntl
          bcmath
          gd
          zip;

        echo '======================================';
        echo ' Instalando Composer ';
        echo '======================================';

        if [ ! -f /usr/local/bin/composer ]; then
          curl -sS https://getcomposer.org/installer |
          php -- --install-dir=/usr/local/bin --filename=composer;
        fi;

        composer --version;

        echo '======================================';
        echo ' Instalando dependencias OSUMS ';
        echo '======================================';

        cd /var/www/html;

        if [ -f composer.json ]; then
          composer install
            --no-interaction
            --prefer-dist
            --optimize-autoloader;
        else
          echo 'ERROR: No se encontró composer.json';
          exit 1;
        fi;

        echo '======================================';
        echo ' Configurando Laravel ';
        echo '======================================';

        if [ -f .env.example ] && [ ! -f .env ]; then
          cp .env.example .env;
        fi;

        if [ -f artisan ]; then
          php artisan key:generate --force || true;
          php artisan storage:link || true;
          php artisan migrate --force || true;
        fi;

        mkdir -p storage bootstrap/cache;

        chown -R www-data:www-data
          storage
          bootstrap/cache;

        echo '======================================';
        echo ' Configurando Apache ';
        echo '======================================';

        a2enmod rewrite;

        sed -i
          's#DocumentRoot /var/www/html#DocumentRoot /var/www/html/public#'
          /etc/apache2/sites-available/000-default.conf;

        sed -i
          's#<Directory /var/www/>#<Directory /var/www/html/public>#'
          /etc/apache2/apache2.conf || true;

        echo '======================================';
        echo ' OSUMS iniciado ';
        echo '======================================';

        apache2-foreground
      "

  db:
    image: mariadb:10.6
    container_name: osums-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: osums
      MYSQL_USER: osums
      MYSQL_PASSWORD: osums_password
      MYSQL_ROOT_PASSWORD: cambia_root_password

    volumes:
      - osums_db:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


volumes:
  osums_db:
  osums_vendor:
  osums_storage:
