
services:

  app:
    image: php:8.1-apache
    container_name: osums-app
    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html
      - osums_storage:/var/www/html/storage

    environment:
      APP_ENV: production
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: osums
      DB_USERNAME: osums
      DB_PASSWORD: osums_password

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8080:80"

    command: >
      bash -c "
        apt-get update &&
        apt-get install -y
          git
          unzip
          libzip-dev
          libpng-dev
          libjpeg-dev
          libfreetype6-dev
          libonig-dev
          libxml2-dev
          libicu-dev
          libpq-dev &&
        docker-php-ext-configure gd
          --with-freetype
          --with-jpeg &&
        docker-php-ext-install
          pdo_mysql
          mbstring
          exif
          pcntl
          bcmath
          gd
          zip &&
        if [ ! -f /usr/local/bin/composer ]; then
          php -r 'copy(\"https://getcomposer.org/installer\", \"composer-setup.php\");' &&
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer &&
          rm composer-setup.php;
        fi &&
        composer install --no-dev --optimize-autoloader &&
        if [ -f .env.example ] && [ ! -f .env ]; then
          cp .env.example .env;
        fi &&
        php artisan key:generate --force &&
        php artisan storage:link || true &&
        php artisan migrate --force || true &&
        chown -R www-data:www-data storage bootstrap/cache &&
        a2enmod rewrite &&
        sed -i 's/AllowOverride None/AllowOverride All/g' /etc/apache2/apache2.conf &&
        apache2-foreground
      "

  db:
    image: mariadb:10.6
    container_name: osums-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: osums
      MYSQL_USER: osums
      MYSQL_PASSWORD: osums_password
      MYSQL_ROOT_PASSWORD: cambia_root_password

    volumes:
      - osums_db:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


volumes:
  osums_db:
  osums_storage:

